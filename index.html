<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学習用資料閲覧システム</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f3f4f6;
      font-family: sans-serif;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .shortcut-container {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 9999;
      display: none;
    }

    .btn-chat {
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-chat:hover {
      background-color: #4338ca;
    }

    .btn-chat:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <div id="shortcut-container" class="shortcut-container">
    <button id="btn-open-chat" class="btn-chat">
      💬 チャットを開く
    </button>
  </div>

  <iframe id="tester-iframe"></iframe>

  <script>
    window.addEventListener("DOMContentLoaded", () => {

      const iframe = document.getElementById("tester-iframe");
      const chatBtn = document.getElementById("btn-open-chat");
      const container = document.getElementById("shortcut-container");

      // ========================================
      // プロキシ設定
      // ========================================

      const PROXY_BASE = "https://renderproxy-pre1.onrender.com/";

      // ========================================
      // クエリパラメータ取得
      // ========================================

      const params = new URLSearchParams(window.location.search);

      // ?url= の値
      let queryUrl = params.get("url");

      // ?proxy が存在するか
      const useProxy = params.has("proxy");

      let targetUrl;

      // ========================================
      // URLパラメータがある場合
      // ========================================

      if (queryUrl !== null) {

        queryUrl = queryUrl.trim();

        if (queryUrl === "") {
          queryUrl = "https://example.com";
        }

        targetUrl = queryUrl;

      } else {

        // ========================================
        // URLパラメータがない場合
        // 通常通りプロンプト表示
        // ========================================

        let inputUrl = prompt(
          "テストしたいURLを入力してください（キャンセル・無入力なら example.com）："
        );

        if (inputUrl === null || inputUrl.trim() === "") {
          inputUrl = "example.com";
        } else {
          inputUrl = inputUrl.trim();
        }

        targetUrl = inputUrl;
      }

      // ========================================
      // URL正規化
      // ========================================

      if (
        !targetUrl.startsWith("https://") &&
        !targetUrl.startsWith("http://")
      ) {
        targetUrl = "https://" + targetUrl;
      }

      // ========================================
      // Base64変換
      // 日本語URL対応
      // ========================================

      function encodeBase64(str) {

        const bytes = new TextEncoder().encode(str);

        let binary = "";

        for (const byte of bytes) {
          binary += String.fromCharCode(byte);
        }

        return btoa(binary);
      }

      // ========================================
      // 最終URL生成
      // ========================================

      let finalUrl = targetUrl;

      if (useProxy) {

        const encodedUrl = encodeBase64(targetUrl);

        finalUrl = PROXY_BASE + encodedUrl;

      }

      // ========================================
      // iframe読み込み
      // ========================================

      iframe.addEventListener("load", () => {

        try {

          // 元のURLがexample.comなら表示
          if (targetUrl.includes("example.com")) {

            container.style.display = "block";

          } else {

            container.style.display = "none";

          }

        } catch (e) {

          container.style.display = "none";

        }

      });

      // ========================================
      // チャットボタン
      // ========================================

      chatBtn.addEventListener("click", () => {

        iframe.src = "https://knj48-ver-chatsystem.onrender.com/";

        container.style.display = "none";

      });

      // ========================================
      // iframe表示
      // ========================================

      iframe.src = finalUrl;

    });
  </script>

</body>
</html>
