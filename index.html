<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学習用資料閲覧システム</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f3f4f6;
      font-family: sans-serif;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .shortcut-container {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 9999;
      display: none;
    }

    .btn-chat {
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-chat:hover {
      background-color: #4338ca;
    }

    .btn-chat:active {
      transform: scale(0.95);
    }

    .iframe-warning {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100%;
      padding: 24px;
      text-align: center;
    }

    .iframe-warning h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    .iframe-warning p {
      margin: 0 0 20px;
      color: #4b5563;
    }

    .iframe-warning a {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 20px;
      background-color: #4f46e5;
      color: white;
      font-weight: bold;
      text-decoration: none;
    }

    .iframe-warning a:hover {
      background-color: #4338ca;
    }
  </style>
</head>

<body>
  <!-- チャットボタン -->
  <div id="shortcut-container" class="shortcut-container">
    <button id="btn-open-chat" class="btn-chat">
      💬 チャットを開く
    </button>
  </div>

  <!-- iframe -->
  <iframe id="tester-iframe"></iframe>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      // このページ自体がiframe内で開かれている場合
      if (window.self !== window.top) {
        document.body.replaceChildren();

        const warning = document.createElement("main");
        warning.className = "iframe-warning";

        const heading = document.createElement("h1");
        heading.textContent = "Don't open in Iframe";

        const description = document.createElement("p");
        description.textContent =
          "このページは新しいタブで開いてください。";

        const link = document.createElement("a");
        link.href = window.location.href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Open in new tab";

        warning.append(heading, description, link);
        document.body.appendChild(warning);

        // 通常の処理を実行しない
        return;
      }

      // ========================================
      // 要素取得
      // ========================================

      const iframe = document.getElementById("tester-iframe");
      const chatBtn = document.getElementById("btn-open-chat");
      const container = document.getElementById("shortcut-container");

      // ========================================
      // 設定
      // ========================================

      const PROXY_BASE = "https://renderproxy-production.up.railway.app/";
      const CHAT_URL = "https://knj48-ver-chatsystem.onrender.com/";

      // ========================================
      // クエリパラメータ取得
      // ========================================

      const params = new URLSearchParams(window.location.search);
      let queryUrl = params.get("url");

      // ?proxy があるか
      const useProxy = params.has("proxy");

      let targetUrl;
      let isChatOpen = false;

      // ========================================
      // 表示するURLを決定
      // ========================================

      if (queryUrl !== null) {
        queryUrl = queryUrl.trim();

        if (queryUrl === "") {
          queryUrl = "https://example.com";
        }

        targetUrl = queryUrl;
      } else {
        let inputUrl = prompt(
          "テストしたいURLを入力してください（キャンセル・無入力なら example.com）："
        );

        if (inputUrl === null || inputUrl.trim() === "") {
          inputUrl = "example.com";
        } else {
          inputUrl = inputUrl.trim();
        }

        targetUrl = inputUrl;
      }

      // ========================================
      // URL正規化
      // ========================================

      if (
        !targetUrl.startsWith("https://") &&
        !targetUrl.startsWith("http://")
      ) {
        targetUrl = "https://" + targetUrl;
      }

      // ========================================
      // Base64変換（日本語URL対応）
      // ========================================

      function encodeBase64(str) {
        const bytes = new TextEncoder().encode(str);
        let binary = "";

        for (const byte of bytes) {
          binary += String.fromCharCode(byte);
        }

        return btoa(binary);
      }

      // ========================================
      // プロキシURL生成
      // ========================================

      let finalUrl = targetUrl;

      if (useProxy) {
        const encodedUrl = encodeBase64(targetUrl);
        finalUrl = PROXY_BASE + encodedUrl;
      }

      // ========================================
      // チャットボタン表示制御
      // ========================================

      function updateChatButton() {
        if (isChatOpen) {
          container.style.display = "none";
          return;
        }

        if (targetUrl.includes("example.com")) {
          container.style.display = "block";
        } else {
          container.style.display = "none";
        }
      }

      // ========================================
      // iframe読み込み完了
      // ========================================

      iframe.addEventListener("load", () => {
        updateChatButton();
      });

      // ========================================
      // チャットボタン
      // ========================================

      chatBtn.addEventListener("click", () => {
        isChatOpen = true;
        container.style.display = "none";
        iframe.src = CHAT_URL;
      });

      // ========================================
      // iframe表示開始
      // ========================================

      iframe.src = finalUrl;
    });
  </script>
</body>
</html>
